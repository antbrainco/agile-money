[package]
name = "tilly-vault"
description = "Solana program holding the agent's SOL, with per-payment, daily and recipient limits."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "5"

# Versions match what litesvm 0.18 builds against.
[dev-dependencies]
litesvm = "0.18"
solana-address = "2.7"
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.6"
solana-signer = "3"
solana-transaction = "4.3"
solana-system-interface = { version = "3.3", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-panic", "custom-heap"))'] }
