# Tilly on a server: the bot, plus a Cloudflare Tunnel that carries Telegram's
# webhook to it. Postgres is external (Neon). Run from this directory:
#   docker compose up -d --build
# Secrets live in ./bot.env (chmod 600), never in this file or the image.
services:
  bot:
    build: ..
    image: tilly-bot
    restart: unless-stopped
    env_file: bot.env
    environment:
      # Inside the compose network; only cloudflared reaches it. Nothing is published.
      WARDEN_TELEGRAM__WEBHOOK__LISTEN: 0.0.0.0:8443
      RUST_LOG: ${RUST_LOG:-info}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./tunnel.json:/etc/cloudflared/tunnel.json:ro
    depends_on: [bot]
