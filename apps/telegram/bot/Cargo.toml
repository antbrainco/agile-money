[package]
name = "warden-telegram-bot"
description = "Tilly's Telegram bot: chat with the agent and answer approvals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
jiff.workspace = true
png.workspace = true
qrcode.workspace = true
secrecy.workspace = true
uuid = { workspace = true, features = ["v4"] }
teloxide.workspace = true
totp-rs.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
warden-agent-core.workspace = true
warden-domain.workspace = true
warden-executor.workspace = true
warden-policy.workspace = true
warden-store.workspace = true
warden-rail-sol = { workspace = true, optional = true }
warden-rail-paypal = { workspace = true, optional = true }
warden-rail-near = { workspace = true, optional = true }
warden-rail-bch = { workspace = true, optional = true }
warden-rail-concordium = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# Solana sends and receives; PayPal takes payment requests in USD. The bot needs sol.
default = ["sol", "paypal"]
sol = ["dep:warden-rail-sol"]
paypal = ["dep:warden-rail-paypal"]
near = ["dep:warden-rail-near"]
bch = ["dep:warden-rail-bch"]
concordium = ["dep:warden-rail-concordium"]
