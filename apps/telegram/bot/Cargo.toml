[package]
name = "agile-money-telegram-bot"
description = "Agile Money's Telegram bot: chat with the agent and answer approvals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
jiff.workspace = true
png.workspace = true
qrcode = { workspace = true, features = ["svg"] }
secrecy.workspace = true
uuid = { workspace = true, features = ["v4"] }
teloxide.workspace = true
totp-rs.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
bs58.workspace = true
solana-signature.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
agile-money-agent-core.workspace = true
agile-money-domain.workspace = true
agile-money-executor.workspace = true
agile-money-policy.workspace = true
agile-money-store.workspace = true
agile-money-rail-sol = { workspace = true, optional = true }
agile-money-rail-paypal = { workspace = true, optional = true }
agile-money-rail-near = { workspace = true, optional = true }
agile-money-rail-bch = { workspace = true, optional = true }
agile-money-rail-concordium = { workspace = true, optional = true }

[dev-dependencies]
solana-sdk.workspace = true

[lints]
workspace = true

[features]
# Solana sends and receives; PayPal takes payment requests in USD. The bot needs sol.
default = ["sol", "paypal"]
sol = ["dep:agile-money-rail-sol"]
paypal = ["dep:agile-money-rail-paypal"]
near = ["dep:agile-money-rail-near"]
bch = ["dep:agile-money-rail-bch"]
concordium = ["dep:agile-money-rail-concordium"]
