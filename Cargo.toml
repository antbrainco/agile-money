[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/agent/core",
    "crates/policy",
    "crates/store",
    "crates/executor",
    "crates/rail/sol",
    "crates/rail/paypal",
    "crates/rail/near",
    "crates/rail/bch",
    "crates/rail/concordium",
    "crates/scout",
    "crates/x402",
    "apps/telegram/bot",
    "apps/shop",
]
# Onchain contracts build for their own targets (wasm, BPF) with their own toolchains.
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
# Internal crates
agile-money-domain = { path = "crates/domain" }
agile-money-agent-core = { path = "crates/agent/core" }
agile-money-policy = { path = "crates/policy" }
agile-money-store = { path = "crates/store" }
agile-money-executor = { path = "crates/executor" }
agile-money-rail-sol = { path = "crates/rail/sol" }
agile-money-rail-paypal = { path = "crates/rail/paypal" }
agile-money-rail-near = { path = "crates/rail/near" }
agile-money-rail-bch = { path = "crates/rail/bch" }
agile-money-rail-concordium = { path = "crates/rail/concordium" }
agile-money-scout = { path = "crates/scout" }
agile-money-x402 = { path = "crates/x402" }

# Core
anyhow = "1.0.104"
async-trait = "0.1.92"
bs58 = "0.5.1"
hex = "0.4.3"
jiff = { version = "0.2.39", features = ["serde"] }
rust_decimal = "1.43.0"
schemars = "1.2.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

# Runtime, I/O
axum = "0.8.9"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff-sqlx = { version = "0.2.1", features = ["postgres"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "json"] }
solana-commitment-config = "3.1.1"
solana-rpc-client = "4.2.2"
solana-sdk = "5.0.0"
solana-signature = { version = "3.6.0", features = ["verify"] }
solana-system-interface = "3.3.0"
spl-memo-interface = "2.1.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"
solana-transaction-status-client-types = "4.4.0"
teloxide = { version = "0.17.0", features = ["macros", "webhooks-axum"] }
# Payment request QR codes, drawn by hand and written as PNG.
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tower = { version = "0.5.3", features = ["timeout", "retry", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Testing
insta = { version = "1.49.0", features = ["json"] }
mockall = "0.15.0"
proptest = "1.12.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
