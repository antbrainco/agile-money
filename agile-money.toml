# Non-secret config. Overridden by AGILE_MONEY_* env vars (figment); secrets never go here.
network = "devnet" # mainnet also needs a per-rail opt-in below (rule 5)

[database] # url comes from DATABASE_URL
max_connections = 10
acquire_timeout_ms = 5000
statement_timeout_ms = 10000
migrate_on_start = true

[telegram] # token comes from TELOXIDE_TOKEN
# Your chat id; message the bot /start to learn it. Or set AGILE_MONEY_TELEGRAM__OWNER_CHAT_ID.
owner_chat_id = 0

# Updates by webhook instead of long polling, on when a URL is set. Needs the tunnel:
#   cloudflared tunnel --config ~/.cloudflared/tilly-dev.yml run
# Env overrides the URL with TUNNEL_URL; the secret comes from TELEGRAM_WEBHOOK_SECRET
# (1-256 of A-Z a-z 0-9 _ -). Registered with Telegram on every start. Remove the url
# to go back to polling.
[telegram.webhook]
url = "https://bot.example.com"  # the tunnel's public base URL
path = "/telegram"
listen = "127.0.0.1:8443"
# drop_pending_updates = false

[executor]
poll_interval_ms = 500
lease_ms = 180000
retry_delay_ms = 90000 # longer than a blockhash lives
watch_delay_ms = 2000

[agent] # key comes from the provider's own variable, e.g. DEEPSEEK_API_KEY
# Unset: detected. A base_url means `compatible`; otherwise the first key found among
# DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY picks deepseek, claude or openai.
# provider = "deepseek"         # deepseek | claude | openai | compatible
step_limit = 12
# Cloudflare's unified AI REST API (OpenAI format), routed through the `my-gateway`
# gateway. The key is a Cloudflare API token: set AGILE_MONEY_AGENT__API_KEY. Third-party
# models bill through Unified Billing, so no provider key is needed.
provider = "compatible"
# DeepSeek V4 Flash on Workers AI: function calling, ~1.6s per step. Stronger but
# ~2.5x slower: @cf/deepseek-ai/deepseek-v4-pro-0813. Third-party models are
# author/model, e.g. openai/gpt-5.5.
model = "@cf/deepseek-ai/deepseek-v4-flash-0731"
base_url = "https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/v1/"
# model = "deepseek-flash"      # defaults per provider; required for `compatible`
# base_url = "http://localhost:11434/v1"  # any OpenAI-compatible endpoint
# stream = true                 # SSE; replies appear in Telegram as they're written
# max_tokens = 2048
# extra_body = { }              # merged into every request body

[agent.http]
connect_timeout_ms = 10000
read_timeout_ms = 60000         # longest silence mid-stream
request_timeout_ms = 120000     # whole call, non-streaming only
max_retries = 2                 # on 408/409/429/5xx and connect errors, honouring Retry-After

# Route through Cloudflare AI Gateway. Exclusive with base_url. For an authenticated
# gateway set AGILE_MONEY_AGENT__GATEWAY__TOKEN; with stored keys (BYOK) the API key is optional.
# [agent.gateway]
# account_id = "your-account-id"
# gateway_id = "default"

[agent.headers]                 # extra non-secret headers, e.g. gateway options
cf-aig-gateway-id = "my-gateway"
# cf-aig-collect-log-payload = "false"

# [agent.openai]
# organization = "org-..."
# project = "proj_..."
# reasoning_effort = "low"

# [agent.anthropic]
# version = "2023-06-01"
# betas = []
# thinking_budget = 1024        # below max_tokens

[rail.sol] # keypair comes from AGILE_MONEY_RAIL__SOL__KEYPAIR
rpc_url = "https://api.devnet.solana.com"
mainnet = false

# On-chain vault (contracts/sol/vault): SOL is held by the program and paid out only
# within the per-payment cap, daily cap and recipient list the owner key signed for.
# The bot's keypair can ask it to pay but can't change those. Set up with
# `cargo run -p agile-money-rail-sol --example vault`; both values are public keys.
# Remove this section to pay from the bot's wallet again.
[rail.sol.vault]
program = "<VAULT_PROGRAM_ID>"
owner = "<OWNER_PUBKEY>"

# PayPal: payment requests in USD as checkout links, paid by PayPal or card. On when
# AGILE_MONEY_RAIL__PAYPAL__CLIENT_ID and AGILE_MONEY_RAIL__PAYPAL__CLIENT_SECRET are set, from a
# sandbox REST app at developer.paypal.com. Sandbox unless live = true (rule 5).
# [rail.paypal]
# live = false
# return_url = "https://example.com/thanks"  # where the payer lands after paying

# The owner's limits, one section per asset, in its major unit. Only a human
# edits these (rule 9); a change is stored as a new policy version on the next
# start. An asset without a section can't be paid.
[policy.sol]
max_per_tx = "1"
approval_above = "0.05"
max_per_day = "2"

# USDC (SPL token). The mint defaults to Circle's for `network`; override with
# rail.sol.usdc_mint. Devnet USDC: https://faucet.circle.com (pick Solana Devnet).
[policy.usdc]
max_per_tx = "50"
approval_above = "10"
max_per_day = "100"

[security] # the authenticator secret comes from TOTP_SECRET (--example totp_setup)
# A new or changed contact waits this long before it can be paid, so a stolen
# Telegram session can't add a payee and pay it at once. Cancel any time.
cooling_off = "24h"
# Payments a day that may go through on their own; past this, each one asks you,
# however small, so injected text can't drain saved contacts a little at a time.
payments_per_day = 5

# Who the agent may pay; anything else is denied by policy. Seeded as live contacts at startup. Add more from Telegram (/addcontact) or the
# dashboard; those need a code and wait out the cooling-off.
[[contacts]]
label = "Acme Design"
address = "7Np41oeYqPefeNQEHSv1UDhYrehxin3NStELsSKCT4K2"

[[contacts]]
label = "Bob"
address = "11111111111111111111111111111111"
